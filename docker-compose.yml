services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # The app authenticates to the IRMA server with this token; it must match
      # the token the irma-init service writes into the server config.
      IRMA_API_TOKEN: ${IRMA_API_TOKEN:?set IRMA_API_TOKEN in your .env}
      IRMA_SERVER_URL: http://irma-server:8088
    depends_on:
      migrate:
        condition: service_completed_successfully
      irma-server:
        condition: service_started
      mail:
        condition: service_started
    networks:
      - irma-meet

  # The server never changes the schema; this one-off run does, then exits.
  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in your .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - irma-meet

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: irmameet
      POSTGRES_USER: irmameet
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "irmameet", "-d", "irmameet"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - irma-meet

  # Generates a fresh JWT signing key (never committed) and writes the IRMA
  # server config with requestor token auth enabled, using IRMA_API_TOKEN from
  # the environment. Runs once before irma-server and exits.
  irma-init:
    image: alpine:3.20
    environment:
      IRMA_API_TOKEN: ${IRMA_API_TOKEN:?set IRMA_API_TOKEN in your .env}
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        if [ ! -f /etc/irma/jwt_privkey.pem ]; then
          openssl genrsa -out /etc/irma/jwt_privkey.pem 2048
        fi
        cat > /etc/irma/config.json <<EOF
        {
          "url": "http://localhost:8088",
          "jwt_privkey_file": "/etc/irma/jwt_privkey.pem",
          "no_auth": false,
          "requestors": {
            "irma-meet": { "auth_method": "token", "key": "$IRMA_API_TOKEN" }
          }
        }
        EOF
    volumes:
      - irma_config:/etc/irma
    networks:
      - irma-meet

  irma-server:
    image: ghcr.io/privacybydesign/irma:latest
    command: server -v --config /etc/irma/config.json
    ports:
      - "8088:8088"
    depends_on:
      irma-init:
        condition: service_completed_successfully
    volumes:
      - irma_config:/etc/irma:ro
    networks:
      - irma-meet

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - irma-meet

volumes:
  db_data:
  irma_config:

networks:
  irma-meet:
