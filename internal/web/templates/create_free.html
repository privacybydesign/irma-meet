{{define "title"}}{{.T `Create video meeting`}}{{end}}

{{define "message"}}
<form method="post" action="/irma_session/store">
    <div class="form-group">
        <label class="control-label" for="meeting_name">{{.T `Meeting name`}}</label>
        <input id="meeting_name" name="meeting_name" value="{{.Data.Name}}" type="text" class="form-control{{if .Data.Invalid.meeting_name}} is-invalid{{end}}">
    </div>

    <div class="form-group">
        <label class="control-label" for="hoster_name">{{.T `Host name`}}</label>
        <input id="hoster_name" name="hoster_name" value="{{.Data.HostName}}" type="text" class="form-control" readonly>
    </div>

    <div class="form-group">
        <label class="control-label" for="hoster_email_address">{{.T `Host email address`}}</label>
        <input id="hoster_email_address" name="hoster_email_address" value="{{.Data.HostEmail}}" type="text" class="form-control" readonly>
    </div>

    <div class="form-group">
        <input id="meeting_type" name="meeting_type" value="free" type="hidden">
        <input type="hidden" name="agreed" value="yes">
        <button type="submit" class="btn btn-primary">{{.T `Send invite`}}</button>
    </div>
</form>

{{template "form-errors" .}}
{{end}}
