{{define "buttons-default"}}
<button type="button" class="btn btn-primary btn-lg btn-blue" onclick="startInvitation('/irma_auth/start/default', '/irma_session/create/free');">
	<img class="img-fluid" src="/img/team-icon.svg" alt=""> {{.T `Create video meeting`}}
</button>
<br>
<p style="font-size: 14px; color:#1B4D8C;"><br>{{.T `For use in the Netherlands:`}}</p>
<button type="button" class="btn btn-secondary btn-lg btn-blue" onclick="startInvitation('/irma_auth/start/teacher', '/irma_session/create/exam');">
	<img class="img-fluid" src="/img/exam-icon.svg" alt="">{{.T `Start oral video exam`}}
</button>
{{end}}

{{define "form-errors"}}
{{if .Data.Errors}}
<div class="alert alert-danger">
    <ul>
        {{range .Data.Errors}}
        <li>{{.}}</li>
        {{end}}
    </ul>
</div>
{{end}}
{{end}}
